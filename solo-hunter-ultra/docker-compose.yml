services:
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
  app:
    build: .
    env_file:
      - .env
    depends_on:
      - redis
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ./data:/app/data
      - ./keys:/app/keys
    restart: unless-stopped
volumes:
  redis-data:
