bot:
  name: "Solo-Hunter Ultra"
  mode: "production"
  max_open_positions: 10
  max_daily_loss_sol: 1.0
  emergency_stop: true

rpc:
  endpoints:
    - url: "${HELIUS_RPC_URL}"
      weight: 1.0
      priority: 1
    - url: "${QUICKNODE_RPC_URL}"
      weight: 0.5
      priority: 2
  timeout: 2.0
  max_connections: 50

websocket:
  endpoints:
    - "${HELIUS_WS_URL}"
  reconnect_interval: 1.0
  max_reconnect_attempts: 10

jito:
  relayer_url: "${JITO_RELAYER_URL}"
  auth_key: "${JITO_AUTH_KEY}"
  tip_account: "96gYZGLnJYVFmbjzopPSU6QiEV5fGqZNyN9nmNhvrZU5"
  base_tip_lamports: 10000
  max_tip_percentage: 20

wallet:
  key_path: "./keys/encrypted_wallet.json"
  encryption_key: "${WALLET_ENCRYPTION_KEY}"
  rotation_strategy: "round_robin"
  max_wallets: 5
  min_balance_sol: 0.1

filters:
  min_liquidity_usd: 1000
  max_mint_authority: false
  max_freeze_authority: false
  max_transfer_tax_percent: 10
  min_confidence_score: 0.6

execution:
  simulate_before_send: true
  max_slippage_bps: 200
  compute_unit_limit: 140000
  max_retries: 3
  confirmation_timeout_seconds: 30

position:
  max_position_size_sol: 0.5
  kelly_fraction: 0.25
  stop_loss_bps: 2000
  take_profit_levels: [20000, 30000, 50000, 100000]
  trailing_stop_activation: 30000
  trailing_stop_distance: 15000

redis:
  host: "localhost"
  port: 6379
  db: 0
  decode_responses: false

database:
  path: "./data/trades.db"

monitoring:
  prometheus_port: 9090
  log_level: "INFO"
